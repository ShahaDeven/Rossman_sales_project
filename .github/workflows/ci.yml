name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # JOB 1 — Run Tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Install Python dependencies for artifact creation
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu numpy scikit-learn

      - name: Create dummy model artifacts for testing
        run: |
          python - <<'EOF'
          import pickle
          import json
          import torch
          import torch.nn as nn
          import numpy as np
          from sklearn.preprocessing import MinMaxScaler

          # Create dummy scaler
          scaler = MinMaxScaler()
          scaler.fit(np.zeros((10, 21)))
          with open("scaler.pkl", "wb") as f:
              pickle.dump(scaler, f)

          # Create dummy features list
          features = [
              "Store", "DayOfWeek", "Customers", "Open", "Promo",
              "StateHoliday", "SchoolHoliday", "StoreType", "Assortment",
              "CompetitionDistance", "Promo2", "Year", "Month", "Day",
              "WeekOfYear", "IsPromoMonth", "IsWeekend", "IsHoliday",
              "IsMonthStart", "IsMonthEnd", "DaysSincePromo"
          ]
          with open("features.json", "w") as f:
              json.dump(features, f)

          # Create dummy model weights
          class LSTMModel(nn.Module):
              def __init__(self):
                  super().__init__()
                  self.lstm1 = nn.LSTM(21, 256, batch_first=True)
                  self.dropout1 = nn.Dropout(0.333)
                  self.lstm2 = nn.LSTM(256, 128, batch_first=True)
                  self.dropout2 = nn.Dropout(0.333)
                  self.fc1 = nn.Linear(128, 32)
                  self.fc2 = nn.Linear(32, 32)
                  self.out = nn.Linear(32, 1)
                  self.relu = nn.ReLU()
              def forward(self, x):
                  out, _ = self.lstm1(x)
                  out = self.dropout1(out)
                  out, _ = self.lstm2(out)
                  out = self.dropout2(out)
                  out = out[:, -1, :]
                  out = self.relu(self.fc1(out))
                  out = self.relu(self.fc2(out))
                  return self.out(out).squeeze(1)

          model = LSTMModel()
          torch.save(model.state_dict(), "model_state_dict.pth")
          print("Dummy artifacts created successfully")
          EOF

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

  # JOB 2 — Build Docker Images
  # Runs only on push to main after tests pass
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Install Python for artifacts
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu numpy scikit-learn

      - name: Create dummy artifacts for Docker build
        run: |
          python3 - <<'EOF'
          import pickle, json, torch, torch.nn as nn, numpy as np
          from sklearn.preprocessing import MinMaxScaler

          scaler = MinMaxScaler()
          scaler.fit(np.zeros((10, 21)))
          with open("scaler.pkl", "wb") as f: pickle.dump(scaler, f)

          features = [
              "Store","DayOfWeek","Customers","Open","Promo","StateHoliday",
              "SchoolHoliday","StoreType","Assortment","CompetitionDistance",
              "Promo2","Year","Month","Day","WeekOfYear","IsPromoMonth",
              "IsWeekend","IsHoliday","IsMonthStart","IsMonthEnd","DaysSincePromo"
          ]
          with open("features.json", "w") as f: json.dump(features, f)

          import sqlite3
          conn = sqlite3.connect("mlflow.db")
          conn.close()

          class LSTMModel(nn.Module):
              def __init__(self):
                  super().__init__()
                  self.lstm1 = nn.LSTM(21, 256, batch_first=True)
                  self.dropout1 = nn.Dropout(0.333)
                  self.lstm2 = nn.LSTM(256, 128, batch_first=True)
                  self.dropout2 = nn.Dropout(0.333)
                  self.fc1 = nn.Linear(128, 32)
                  self.fc2 = nn.Linear(32, 32)
                  self.out = nn.Linear(32, 1)
                  self.relu = nn.ReLU()
              def forward(self, x):
                  out, _ = self.lstm1(x)
                  out = self.dropout1(out)
                  out, _ = self.lstm2(out)
                  out = self.dropout2(out)
                  out = out[:, -1, :]
                  out = self.relu(self.fc1(out))
                  out = self.relu(self.fc2(out))
                  return self.out(out).squeeze(1)

          model = LSTMModel()
          torch.save(model.state_dict(), "model_state_dict.pth")
          EOF

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: ./Dockerfile
          push: false
          tags: rossmann-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Dashboard image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: ./Dockerfile.monitoring
          push: false
          tags: rossmann-dashboard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Confirm builds succeeded
        run: echo "Both Docker images built successfully"